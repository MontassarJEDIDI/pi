server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Configuration dynamique avec Eureka
          lower-case-service-id: true
      routes:
        # 1. Exemple de configuration statique (commentée car non utilisée ici)
        # - id: subscription-static
        #   uri: http://localhost:8081
        #   predicates:
        #     - Path=/api/subscriptions/**

        # 2. Configuration dynamique avec Eureka (lb://)
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/subscriptions/**,/api/recommendations/**,/api/risk/**,/api/adjustment/**,/api/notifications/**,/api/promo/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Activation des logs de routage (principe du workshop)
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
